[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "callusguard"
version = "0.6.0"
description = "Record what your coding agents did, learn from shared execution history, derive and enforce guards, and verify each run stayed in scope."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Kai Karlstrom" }]
keywords = ["claude-code", "codex", "ai-agents", "guardrails", "observability", "telemetry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
]

# THE DEPENDENCY WALL.
# Empty, and it stays empty. Enforcement and the offline learning data model are
# stdlib-only. Model access is explicit through a provider command and never imported
# into the synchronous tool-call path.
dependencies = []

[project.optional-dependencies]
telemetry = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
callus = "callusguard.cli:main"
wroteonly = "callusguard.wroteonly.cli:main"

[project.urls]
Homepage = "https://github.com/kkrlstrm/callusguard"
Repository = "https://github.com/kkrlstrm/callusguard"
Issues = "https://github.com/kkrlstrm/callusguard/issues"
Changelog = "https://github.com/kkrlstrm/callusguard/blob/main/CHANGELOG.md"
Security = "https://github.com/kkrlstrm/callusguard/blob/main/SECURITY.md"

[tool.hatch.build.targets.wheel]
packages = ["callusguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
